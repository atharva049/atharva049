<svg xmlns="http://www.w3.org/2000/svg" width="900" height="46"
     viewBox="0 0 900 46" role="img"
     aria-label="Python, physics, and a growing list of side projects.">
  <title>Python, physics, and a growing list of side projects.</title>
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="55%" stop-color="#a7d8f2"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="55%" stop-color="#060a16"/>
      <stop offset="100%" stop-color="#0d0820"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#db2777" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.08" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>
    <filter id="txtGlow" x="-10%" y="-60%" width="120%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tw0">
      <rect x="30" y="0" width="0" height="46">
        <animate attributeName="width" values="0;0;750;750;0;0"
                 keyTimes="0.0;0.0013;0.1667;0.2933;0.3067;1.0"
                 dur="15.0s" repeatCount="indefinite" calcMode="linear"/>
      </rect>
    </clipPath>
    <clipPath id="tw1">
      <rect x="30" y="0" width="0" height="46">
        <animate attributeName="width" values="0;0;750;750;0;0"
                 keyTimes="0.0;0.3347;0.5;0.6267;0.64;1.0"
                 dur="15.0s" repeatCount="indefinite" calcMode="linear"/>
      </rect>
    </clipPath>
    <clipPath id="tw2">
      <rect x="30" y="0" width="0" height="46">
        <animate attributeName="width" values="0;0;750;750;0;0"
                 keyTimes="0.0;0.668;0.8333;0.96;0.9733;1.0"
                 dur="15.0s" repeatCount="indefinite" calcMode="linear"/>
      </rect>
    </clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="45" rx="9" fill="url(#shell)"/>
  <rect x="0.5" y="0.5" width="899" height="45" rx="9" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="899" height="45" rx="9" fill="none"
        stroke="url(#edge)" stroke-width="1"/>
  <rect x="0" y="0" width="3" height="46" rx="1.5" fill="url(#edge)"/>
  <circle cx="17" cy="14" r="2.4" fill="#38bdf8">
    <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <g filter="url(#txtGlow)" opacity="0.55">
  <g clip-path="url(#tw0)">
    <text x="30" y="30" font-size="18" fill="url(#ink)" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace"
          xml:space="preserve">> Python, physics, and a growing list of side projects.<tspan fill="#38bdf8"><animate
      attributeName="opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete"
      dur="1.1s" repeatCount="indefinite"/>|</tspan></text>
  </g>
  <g clip-path="url(#tw1)">
    <text x="30" y="30" font-size="18" fill="url(#ink)" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace"
          xml:space="preserve">> Reading, building, and testing ideas on real hardware.<tspan fill="#38bdf8"><animate
      attributeName="opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete"
      dur="1.1s" repeatCount="indefinite"/>|</tspan></text>
  </g>
  <g clip-path="url(#tw2)">
    <text x="30" y="30" font-size="18" fill="url(#ink)" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace"
          xml:space="preserve">> Interested in AI, security, and space technology.<tspan fill="#38bdf8"><animate
      attributeName="opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete"
      dur="1.1s" repeatCount="indefinite"/>|</tspan></text>
  </g>
  </g>
  <g>
  <g clip-path="url(#tw0)">
    <text x="30" y="30" font-size="18" fill="url(#ink)" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace"
          xml:space="preserve">> Python, physics, and a growing list of side projects.<tspan fill="#38bdf8"><animate
      attributeName="opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete"
      dur="1.1s" repeatCount="indefinite"/>|</tspan></text>
  </g>
  <g clip-path="url(#tw1)">
    <text x="30" y="30" font-size="18" fill="url(#ink)" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace"
          xml:space="preserve">> Reading, building, and testing ideas on real hardware.<tspan fill="#38bdf8"><animate
      attributeName="opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete"
      dur="1.1s" repeatCount="indefinite"/>|</tspan></text>
  </g>
  <g clip-path="url(#tw2)">
    <text x="30" y="30" font-size="18" fill="url(#ink)" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace"
          xml:space="preserve">> Interested in AI, security, and space technology.<tspan fill="#38bdf8"><animate
      attributeName="opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete"
      dur="1.1s" repeatCount="indefinite"/>|</tspan></text>
  </g>
  </g>
</svg>
